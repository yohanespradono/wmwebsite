name: WeMonitor Website
description: Deploy WeMonitor Website to dev.atulatech.com / static

app:
  name: WeMonitor Website
  version: 1.0.0

ssh:
  host: dev.atulatech.com
  port: 10022
  user: atula
  key: ~/.ssh/id_rsa

env:
  TARGET_DIR: ${{ DEPLOYMENT_ENVIRONMENT == 'production' && '$HOME/apps/wemonitor/website' || '$HOME/apps/wemonitor/website' }}
  REPO_URL: git@github.com:yohanespradono/wmwebsite.git

jobs:
  Download:
    steps:
      - name: Git Clone
        run: git clone -b $BRANCH $REPO_URL $TARGET_DIR/releases/$TIMESTAMP

  Install and Build:
    steps:
      - name: Installing Dependencies
        run: export PATH="/home/atula/.nvm/versions/node/v24.11.1/bin:$PATH" ; cd $TARGET_DIR/releases/$TIMESTAMP && npm ci
      - name: Building
        run: export PATH="/home/atula/.nvm/versions/node/v24.11.1/bin:$PATH" ; cd $TARGET_DIR/releases/$TIMESTAMP && taskset -c 0,1 npm run build
      - name: Verify build output
        run: |
          cd $TARGET_DIR/releases/$TIMESTAMP
          if [ ! -f "build/index.html" ]; then
            echo "Build failed: build/index.html not found"
            exit 1
          fi
          echo "Build verification successful"
  Run:
    steps:
      - name: Publishing the application
        run: ln -sfn $TARGET_DIR/releases/$TIMESTAMP $TARGET_DIR/current

  Complete:
    steps:
      - name: Cleaning up dependencies
        run: export PATH="/home/atula/.nvm/versions/node/v24.11.1/bin:$PATH" ; cd $TARGET_DIR/current && npm prune --production
      - name: Cleaning up releases
        run: |
          cd $TARGET_DIR/releases/
          DIRECTORIES_TO_DELETE=""
          for dir in */; do
            dir_name="${dir%/}"
            if [ "$dir_name" != "$TIMESTAMP" ] && [ -d "$dir_name" ]; then
              DIRECTORIES_TO_DELETE+="\"$dir_name\" "
              echo "- $dir_name"
            fi
          done
          if [ ! -z "$DIRECTORIES_TO_DELETE" ]; then
            eval rm -rf $DIRECTORIES_TO_DELETE
            echo "Cleaned up old releases"
          else
            echo "No old releases to clean up"
          fi

teams:
  webhook:
    url:
